<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart City</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Tema Ungu Pastel */
        body { 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            font-family: 'Segoe UI', sans-serif; 
        }
        .login-card { 
            background: rgba(255, 255, 255, 0.9); 
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(107, 70, 193, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn-purple { 
            background-color: #9b5de5; 
            color: white; 
            border-radius: 12px; 
            font-weight: 600; 
            padding: 12px; 
            border: none; 
            transition: 0.3s;
        }
        .btn-purple:hover { 
            background-color: #7641c2; 
            color: white; 
        }
        input { 
            border-radius: 12px !important; 
            border: 2px solid #d1b3ff !important; 
            padding: 12px !important; 
            background-color: #f8f5ff !important;
        }
        input:focus { 
            border-color: #9b5de5 !important; 
            box-shadow: 0 0 8px rgba(155, 93, 229, 0.3) !important;
        }
        label { color: #5a3e8c; font-weight: 600; margin-bottom: 8px; }
        h3 { color: #4a2c7a; font-weight: 700; }
        .text-muted { color: #8e7dbd !important; }
    </style>
</head>
<body>
<div class="container">
    <div class="row align-items-center" style="min-height:70vh">
        <div class="col-md-4 d-none d-md-flex flex-column align-items-start">
            <h2 style="color:#4a2c7a; font-weight:800;">Smart City</h2>
            <p style="color:#6a4c93;">Kelola laporan kota Anda dengan akses yang aman dan elegan.</p>
        </div>

        <div class="col-12 col-md-7">
            <div class="d-flex justify-content-center">
                <div class="card login-card p-5" style="max-width:420px; width:100%;">
                    <div class="text-center mb-4">
                        <h3>Login ✨</h3>
                        <p class="text-muted small">Selamat datang kembali, Warga!</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                                <input type="{{ field.field.widget.input_type }}" 
                                       name="{{ field.name }}" 
                                       id="{{ field.id_for_label }}" 
                                       class="form-control" 
                                       required>
                                {% if field.errors %}
                                    <small class="text-danger">{{ field.errors|striptags }}</small>
                                {% endif %}
                            </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-purple w-100 mt-3">Masuk Sekarang</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <a href="{% url 'home' %}" class="text-decoration-none small" style="color: #8e7dbd;">
                            &larr; Kembali ke Beranda
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
