<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanada Vibes 2026 🍁</title>
    <style>
        body {
            background-color: #fff5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #4a4a4a;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 2px dashed #ffb3b3;
            max-width: 400px;
        }

        h1 {
            color: #ff4d4d;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .emoji-float {
            font-size: 3rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div class="emoji-float">🍁✨</div>

    <div class="card">
        <h1>Halo, Kanada!</h1>
        <p>Selamat datang di pelukan hangat kota Kanada tahun 2026. Tempat di mana udara segar, pohon mapel makin rimbun, dan setiap sudutnya bikin hati adem! ❄️🏡</p>
        <p style="font-size: 0.8rem; color: #aaa;">Dibuat dengan penuh kasih sayang & sirup mapel.</p>
    </div>

</body>
</html>
