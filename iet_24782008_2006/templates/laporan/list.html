{% block extra_js %}
<script>

// 🔥 biar gak error kalau element belum kebaca
document.addEventListener("DOMContentLoaded", function(){

    // 🔍 LIVE SEARCH (FIX URL + AMAN)
    const searchInput = document.getElementById('searchInput');

    if(searchInput){
        searchInput.addEventListener('keyup', function(){

            fetch(`/api/search/?q=${this.value}`)
            .then(res => res.json())
            .then(data => {

                console.log("DATA SEARCH:", data); // 🔥 buat screenshot nomor 6

                let table = document.getElementById('reportTable');
                table.innerHTML = '';

                if(data.results.length === 0){
                    table.innerHTML = `
                        <tr>
                            <td colspan="3" class="text-center text-muted">
                                😢 Data tidak ditemukan
                            </td>
                        </tr>
                    `;
                }

                data.results.forEach(item => {
                    table.innerHTML += `
                        <tr onclick="showDetail(${item.id})">
                            <td>${item.title}</td>
                            <td>📍 ${item.location ?? '-'}</td>
                            <td>💜 ${item.status}</td>
                        </tr>
                    `;
                });

            })
            .catch(err => console.log("ERROR:", err));

        });
    }

});

// 📄 DETAIL MODAL (SUDAH BENAR)
function showDetail(id){
    fetch(`/api/report/${id}/`)
    .then(res => res.json())
    .then(data => {

        console.log("DETAIL:", data); // 🔥 buat bukti screenshot

        document.getElementById('modalTitle').innerText = data.title;
        document.getElementById('modalCategory').innerText = data.category;
        document.getElementById('modalStatus').innerText = data.status;
        document.getElementById('modalDesc').innerText = data.description;

        document.getElementById('modal').style.display = 'block';
    });
}

function closeModal(){
    document.getElementById('modal').style.display = 'none';
}

</script>
{% endblock %}
