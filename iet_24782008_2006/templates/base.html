{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}IET City{% endblock %}</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #f8f9ff, #eef2ff);
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(135deg, #d9c6ff, #cdb4db);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-radius: 0 0 20px 20px;
        }

        .nav-link {
            color: #4a148c !important;
            font-weight: 500;
            margin: 0 10px;
        }

        .nav-link:hover {
            color: #ff4d9d !important;
            transform: translateY(-2px);
        }

        .user-badge {
            background: #ede9fe;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #6b21a8;
        }

        .logout-btn {
            border: 1px solid #ff4d9d;
            color: #ff4d9d;
            border-radius: 20px;
            padding: 4px 12px;
            background: transparent;
        }

        .logout-btn:hover {
            background: #ff4d9d;
            color: white;
        }

        .main-container {
            padding-top: 30px;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">

        <a class="navbar-brand fw-bold text-purple" href="#">
            🦝 Raccoon City
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- 🔥 MENU SCROLL -->
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#info">Info</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#reports">Reports</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#contact">Contact</a>
                </li>
            </ul>

            <!-- USER -->
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <div class="user-badge">
                        👤 {{ user.username }}
                    </div>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="logout-btn">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="nav-link">Login</a>
                {% endif %}
            </div>

        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="main-container">
    {% block content %}{% endblock %}
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
