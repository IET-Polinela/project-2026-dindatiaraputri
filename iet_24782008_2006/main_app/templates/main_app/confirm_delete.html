<!DOCTYPE html>
<html>
<head>
    <title>Hapus Laporan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding-top: 80px;
        }

        .card {
            background: white;
            padding: 30px;
            margin: auto;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #e74c3c;
        }

        p {
            margin: 15px 0;
            color: #555;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
        }

        .btn-cancel {
            background-color: #95a5a6;
            color: white;
            margin-left: 10px;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>⚠️ Hapus Laporan</h2>

    <p>Apakah kamu yakin ingin menghapus laporan ini?</p>
    <p><strong>{{ object }}</strong></p>

    <form method="POST" style="margin-top:20px;">
        {% csrf_token %}
        <button type="submit" class="btn btn-delete">Ya, Hapus</button>
        <a href="{% url 'report_list' %}" class="btn btn-cancel">Batal</a>
    </form>
</div>

</body>
</html>
