<!DOCTYPE html>
<html>
<head>
    <title>Tambah Laporan</title>
    <style>
        body {
            background-color: #fff0f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }

        /* Style untuk Django Messages (Alert) */
        .messages {
            width: 350px;
            list-style: none;
            padding: 0;
            margin-bottom: 15px;
        }
        .alert {
            padding: 15px;
            border-radius: 10px;
            background-color: #fce4ec;
            color: #d81b60;
            border: 1px solid #f8bbd0;
            text-align: center;
            font-size: 14px;
        }

        form {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
            width: 350px;
            border: 2px solid #ffb6c1;
        }

        h2 { color: #ff69b4; text-align: center; }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #ffe4e1;
            border-radius: 10px;
            box-sizing: border-box;
        }

        /* Style Tombol & Loading */
        #btn-submit {
            width: 100%;
            background-color: #ffb6c1;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #btn-submit:disabled {
            background-color: #f8bbd0;
            cursor: not-allowed;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff69b4;
            border-radius: 50%;
            width: 15px;
            height: 15px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            display: none; /* Sembunyi secara default */
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="alert">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <form method="POST" id="reportForm">
        <h2>Tambah Laporan</h2>
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" id="btn-submit">
            <span class="loader" id="loader"></span>
            <span id="btn-text">Simpan</span>
        </button>
    </form>

    <a href="{% url 'report_list' %}" style="margin-top: 20px; color: #db7093; text-decoration: none;">Kembali</a>

    <script>
        // Script untuk Loading Feedback
        const form = document.getElementById('reportForm');
        const btn = document.getElementById('btn-submit');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btn-text');

        form.onsubmit = function() {
            btn.disabled = true;           // Nonaktifkan tombol
            loader.style.display = 'block'; // Tampilkan spinner
            btnText.innerText = 'Loading...'; // Ubah teks
        };
    </script>
</body>
</html>
