<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart City</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            font-family: 'Poppins', sans-serif;
        }
        .login-card { 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            border: none; 
        }
        .btn-pink { 
            background-color: #ff69b4; 
            color: white; 
            border-radius: 12px; 
            font-weight: 600;
            padding: 10px;
            border: none;
        }
        .btn-pink:hover { 
            background-color: #e91e63; 
            color: white; 
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
        }
        /* Styling untuk input agar senada */
        input {
            border-radius: 10px !important;
            border: 1px solid #ffafbd !important;
            padding: 10px !important;
        }
        input:focus {
            box-shadow: 0 0 0 0.25 margin-left rgba(255, 105, 180, 0.25) !important;
            border-color: #ff69b4 !important;
        }
        label {
            color: #6d594f;
            font-weight: 500;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card login-card p-4">
                <div class="text-center mb-4">
                    <h3 style="color: #d81b60; font-weight: 600;">Login ✨</h3>
                    <p class="text-muted small">Selamat datang kembali di Raccoon City</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    
                    {# Looping form secara manual agar lebih cantik daripada .as_p #}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {# Tambahkan class form-control secara manual #}
                            <div class="input-group">
                                <input type="{{ field.field.widget.input_type }}" 
                                       name="{{ field.name }}" 
                                       id="{{ field.id_for_label }}" 
                                       class="form-control" 
                                       required>
                            </div>
                            {% if field.errors %}
                                <small class="text-danger">{{ field.errors|striptags }}</small>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-pink w-100 mt-2">Masuk Sekarang</button>
                </form>
                
                <div class="text-center mt-4">
                    <a href="{% url 'report_list' %}" class="text-decoration-none small" style="color: #a98467;">
                        <i class="bi bi-arrow-left"></i> Kembali ke Beranda
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
