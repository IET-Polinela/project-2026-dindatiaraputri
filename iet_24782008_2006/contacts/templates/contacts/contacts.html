<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo Sayang Kanada 🍁</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .phone-card {
            background: white;
            padding: 40px;
            border-radius: 50px;
            box-shadow: 0 20px 0px #e63946;
            text-align: center;
            border: 5px solid #333;
            transform: rotate(-2deg);
            transition: 0.3s;
            cursor: pointer;
        }

        .phone-card:hover {
            transform: rotate(0deg) scale(1.05);
        }

        h1 {
            color: #d62828;
            margin-top: 0;
            font-size: 2rem;
        }

        .contact-box {
            background: #fff0f0;
            padding: 15px;
            border-radius: 20px;
            border: 3px dashed #ffb3b3;
            margin-top: 20px;
        }

        .number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4a4a4a;
            display: block;
            margin-top: 10px;
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="phone-card">
        <div class="emoji">📞✨</div>
        <h1>Halo-halo Bandung? <br>Bukan, ini Kanada!</h1>
        <p>Butuh teman curhat atau nanya jalan ke kebun mapel?</p>
        
        <div class="contact-box">
            <span>Hubungi Bestie kamu di:</span>
            <span class="number">📱 123-456-7890</span>
        </div>
        
        <p style="margin-top: 20px; font-size: 0.8rem; color: #888;">
            *Jangan telepon jam tidur beruang ya! 🐻💤
        </p>
    </div>

</body>
</html>
