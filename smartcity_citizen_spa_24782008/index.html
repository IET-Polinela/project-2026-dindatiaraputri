<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌻 Sunflower Citizen Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #FFF9E6;
            background-image:
                radial-gradient(circle at 15% 20%, #FFF176 0%, transparent 20%),
                radial-gradient(circle at 85% 80%, #FFE082 0%, transparent 20%);
            font-family: 'Segoe UI', sans-serif;
        }

        .spa-container {
            min-height: calc(100vh - 80px);
        }

        .navbar {
            background: linear-gradient(
                90deg,
                #FFD54F,
                #FFE082
            ) !important;
        }

        .navbar-brand {
            color: #6D4C41 !important;
            font-weight: bold;
            font-size: 1.4rem;
        }

        .card {
            border: none;
            border-radius: 25px;
            background: #FFFDF5;
        }

        .btn-primary {
            background-color: #FFD54F;
            border: none;
            color: #6D4C41;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: #FFCA28;
            color: #6D4C41;
        }

        .form-control {
            border-radius: 15px;
        }

        .sunflower-decoration {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 60px;
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg shadow-sm">

        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-flower1 me-2"></i>
                🌻 Sunflower Citizen Portal
            </a>

            <div id="nav-menus" class="ms-auto"></div>

        </div>

    </nav>

    <main class="container-fluid px-4 mt-4 spa-container" id="app-content">
    </main>

    <div class="sunflower-decoration">
        🌻
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>

</body>

</html>
